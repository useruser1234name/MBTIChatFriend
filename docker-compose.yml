version: "3.8"
services:
  server:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./server:/app
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mbti_app}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-mbti_chat}
    depends_on:
      - db
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mbti_chat}
      - POSTGRES_USER=${POSTGRES_USER:-mbti_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
